[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "italiano-anki"
version = "0.1.0"
description = "A lesson-memory database for Italian classes that generates Anki flashcards."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "PyYAML>=6.0",
    "genanki>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["italiano"]

[tool.pytest.ini_options]
testpaths = ["tests"]
